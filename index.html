<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FuelTech Smart Tank</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body {
    background: radial-gradient(circle at top, #1e293b, #020617);
    font-family: Inter, sans-serif;
    color: white;
}
.glass {
    background: rgba(30, 41, 59, 0.65);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.08);
}
.glow-red { box-shadow: 0 0 25px rgba(239,68,68,.45); }
.glow-green { box-shadow: 0 0 25px rgba(34,197,94,.35); }

@keyframes shake {
    from { transform: translateX(-4px); }
    to { transform: translateX(4px); }
}
#alertBox { animation: shake .5s infinite alternate; }
</style>
</head>

<body class="min-h-screen">

<!-- HEADER -->
<header class="px-8 py-6 flex justify-between items-center border-b border-white/10">
    <h1 class="text-2xl font-extrabold">
        ⛽ <span class="text-blue-400">Fuel</span>Tech Monitor
    </h1>
    <span class="text-sm text-gray-400">Smart Tank Dashboard</span>
</header>

<!-- ALERT -->
<div id="alertBox" class="hidden fixed top-6 right-6 z-50">
    <div class="bg-red-600/90 glow-red px-6 py-4 rounded-xl font-bold">
        ⚠️ BBM KRITIS • &lt; 1 Liter
    </div>
</div>

<!-- CONTENT -->
<main class="p-8">
<div class="grid grid-cols-1 lg:grid-cols-2 gap-10">

<!-- KETINGGIAN -->
<div class="glass rounded-2xl p-8 text-center glow-green">
    <h3 class="text-lg font-semibold text-blue-300 mb-6">Ketinggian BBM</h3>
    <div class="mx-auto" style="width:100px;height:260px">
        <canvas id="chartHeight"></canvas>
    </div>
    <div id="heightInfo" class="mt-6 text-xl font-bold text-emerald-400"></div>
</div>

<!-- VOLUME -->
<div class="glass rounded-2xl p-8 text-center">
    <h3 class="text-lg font-semibold text-blue-300 mb-6">Volume Tangki (Max 5L)</h3>
    <div class="mx-auto" style="width:100px;height:260px">
        <canvas id="chartVolume"></canvas>
    </div>
    <div id="volumeInfo" class="mt-6"></div>
</div>

</div>
</main>

<script>
/* ================= FIREBASE ================= */
firebase.initializeApp({
    apiKey: "AIzaSyBYVwVZUBLXSm7iR5Fp6k-dziJGEuhwExk",
    authDomain: "megaboth007.firebaseapp.com",
    databaseURL: "https://megaboth007.firebaseio.com",
    projectId: "megaboth007"
});

const db = firebase.database();
const jarak = db.ref("/test/jarak");
const vol   = db.ref("/test/vol");

/* ================= KONFIG ================= */
const MAX_LITER = 5;
const WARNING_LITER = 1;
let alarmInterval = null;

/* ================= AUDIO BEEP ================= */
function playBeep() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.frequency.value = 1200;
    gain.gain.value = 0.25;

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + 0.4);
}

if ("Notification" in window) Notification.requestPermission();

/* ================= CHART ================= */
function tankChart(id, maxVal) {
    return new Chart(document.getElementById(id), {
        type: "bar",
        data: {
            labels: ["BBM"],
            datasets: [{
                data: [0],
                backgroundColor: "#22c55e",
                borderRadius: 10
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { display: false },
                y: { display: false, max: maxVal }
            }
        }
    });
}

const heightChart = tankChart("chartHeight", 100);
const volumeChart = tankChart("chartVolume", MAX_LITER);

/* ================= REALTIME ================= */

// KETINGGIAN
jarak.on("value", snap => {
    const tinggi = snap.val();
    heightChart.data.datasets[0].data = [tinggi];
    heightChart.update();
    heightInfo.innerText = tinggi.toFixed(1) + " cm";
});

// VOLUME + ALARM BERULANG
vol.on("value", snap => {
    let liter = snap.val();
    if (liter > MAX_LITER) liter = MAX_LITER;

    const kritis = liter < WARNING_LITER;

    volumeChart.data.datasets[0].data = [liter];
    volumeChart.data.datasets[0].backgroundColor = kritis ? "#ef4444" : "#22c55e";
    volumeChart.update();

    volumeInfo.innerHTML = `
        <p class="text-2xl font-bold ${kritis ? 'text-red-400' : 'text-emerald-400'}">
            ${liter.toFixed(2)} / ${MAX_LITER} Liter
        </p>
        <p class="text-sm text-gray-400">
            Status: ${kritis ? "KRITIS" : "AMAN"}
        </p>
    `;

    // ===== ALARM BERULANG =====
    if (kritis) {
        alertBox.classList.remove("hidden");

        if (!alarmInterval) {
            // beep tiap 2 detik
            alarmInterval = setInterval(() => {
                playBeep();
            }, 2000);

            if (Notification.permission === "granted") {
                new Notification("FuelTech Alert 🚨", {
                    body: "BBM kurang dari 1 Liter!"
                });
            }
        }
    } else {
        alertBox.classList.add("hidden");

        if (alarmInterval) {
            clearInterval(alarmInterval);
            alarmInterval = null;
        }
    }
});
</script>

</body>
</html>
